# Mapeamento de ações orçamentárias para temas (seção 5.4 da especificação).
#
# Critério: a ação entra quando o NOME OFICIAL dela (no SIOP) se refere
# explicitamente ao público ou ao programa do tema. Ações genéricas (salários, administração)
# ficam fora mesmo quando parte do dinheiro atende o tema, porque não dá para separar.
#
# Campos: tema, acao (código), justificativa, subfuncao (opcional: só conta o gasto nessa
# subfunção), ano_inicio/ano_fim (opcionais).
# A lista de candidatas consideradas está em candidatos-acoes.csv.


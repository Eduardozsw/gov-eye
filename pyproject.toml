[project]
name = "goveye"
version = "0.1.0"
description = "Linha do tempo verificável de tributos e políticas públicas federais"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[project.scripts]
goveye = "goveye.cli:main"
fase0 = "goveye.fase0:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[project]
name = "goveye"
version = "0.1.0"
description = "Linha do tempo verificável de tributos e políticas públicas federais"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
fase0 = "goveye.fase0:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

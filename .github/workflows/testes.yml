name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      # A curadoria real precisa estar sempre válida, mesmo com itens pendentes.
      - run: uv run goveye validar
      # O front-end é construído a partir da prévia, montada só com dados versionados (sem rede para as fontes).
      - run: uv run goveye carregar
      - run: uv run goveye site --modo previa
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run tipos
        working-directory: web
      - run: npm run build
        working-directory: web

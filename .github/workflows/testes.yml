name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      # A curadoria real precisa estar sempre válida, mesmo com itens pendentes.
      - run: uv run goveye validar
